# ==============================================================================
# tcbp — config.toml
# Job Configuration File for TCBP (Total Commander Batch Python)
# ==============================================================================

[global]
lang        = "ko"         # "ko" | "en" — output language (overridden by --lang)
on_error    = "continue"   # "continue" | "stop"
parallel    = false
max_workers = 4
output      = "{dir}/{base}{ext}"
log         = false
log_file    = "logs/tcbp_{job}_{timestamp}.log"  # {job}=job name, {timestamp}=YYYYMMDD_HHMMSS — one file per run
pause       = true        # pause then all jobs finished.

[global.tools]
magick   = "C:/_FIX/Graphic/Conv_ImageMagick/magick.exe"
gm       = "C:/_FIX/Graphic/Conv_GraphicsMagick/gm.exe"
pngcrush = "C:/_FIX/Graphic/Conv_PNGcrush/pngcrush.exe"
oxipng   = "c:/_FIX/Graphic/Conv_OxiPNG/oxipng.exe"
flac     = "C:/_FIX/Media_Audio/Conv_FLAC/Win64/flac.exe"
flaccl   = "c:/_FIX/Media_Audio/Conv_FLACCL/CUETools.FLACCL.cmd.exe"
hmp3     = "C:/_FIX/Media_Audio/Conv_HelixMP3/hmp3.exe"

# ==============================================================================
#  IMAGE FORMAT CONVERSION
# ==============================================================================
[jobs.Conv2PNG]
desc        = "Convert images to PNG format"
tool        = "gm"
output      = "{dir}/{base}.png"
parallel    = true
max_workers = 8
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Convert images PNG format (PARALLEL mode, {max_workers} workers)" },
    { msg = "-------------------------------------------------------------------------------" },
]
commands = [
    "{tool} convert -quality 95 {input} {output}",
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Conversion finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ------------------------------------------------------------------------------

[jobs.Conv2JPG]
desc        = "Convert images to JPG format"
tool        = "gm"
output      = "{dir}/{base}.jpg"
parallel    = true
max_workers = 8
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Convert images JPG format (PARALLEL mode, {max_workers} workers)" },
    { msg = "-------------------------------------------------------------------------------" },
]
commands = [
    "{tool} convert -quality 95 {input} {output}",
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Conversion finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ------------------------------------------------------------------------------

[jobs.Conv2BMP]
desc        = "Convert images to BMP format"
tool        = "gm"
output      = "{dir}/{base}.bmp"
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Convert images BMP format" },
    { msg = "-------------------------------------------------------------------------------" },
]
commands = [
    "{tool} convert {input} {output}",
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Conversion finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ==============================================================================
#  PNG Format Optimization
# ==============================================================================
[jobs.oxipng]
desc        = "Optimize PNG format (oxipng)"
tool        = "oxipng"
output      = "{dir}/{base}_optimized{ext}"
parallel    = true
max_workers = 8
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Optimize PNG files (oxipng, PARALLEL mode, {max_workers} workers)" },
    { msg = "-------------------------------------------------------------------------------" },
]
commands = [
     "{tool} -o 5 -t 1 {input} --out {output}",
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Optimzation Finished" },
    { msg = "-------------------------------------------------------------------------------" },
]

# ------------------------------------------------------------------------------

[jobs.pngcrush]
desc        = "Optimize PNG format (pngcrush)"
tool        = "pngcrush"
output      = "{dir}/{base}_crushed{ext}"
parallel    = true
max_workers = 8
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Optimize PNG files (pngcrush, PARALLEL mode, {max_workers} workers)" },
    { msg = "-------------------------------------------------------------------------------" },
]
commands = [
     "{tool} -m 113 -m 121 -m 124 {input} {output}",
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Optimzation Finished" },
    { msg = "-------------------------------------------------------------------------------" },
]

# ==============================================================================
#  IMAGE PROCESSING (1)
# ==============================================================================

[jobs.ResizeImages]
desc     = "Resize images (keep aspect ratio, only to smaller size)"
tool     = "gm"
output   = "{dir}/{base}_resized{ext}"
params = [
    { key="size",   desc="size (pixels)",  type="int" },
]
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Resize images (keep aspect ratio, only to smaller size)" },
    { msg = "   Side Length (longer width or height) : {size} pixels" },
    { msg = "-------------------------------------------------------------------------------" },
]
commands = [
    "{tool} convert -resize {size}x{size}> -filter Lanczos -unsharp 5 -quality 100 {input} {output}",
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Process finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ------------------------------------------------------------------------------

[jobs.CropImages]
desc        = "Crop images"
tool        = "gm"
output      = "{dir}/{base}.bmp"
params = [
    { key="x",      desc="X offset (pixels)",  type="int" },
    { key="y",      desc="Y offset (pixels)",  type="int" },
    { key="width",  desc="Width  (pixels)",    type="int" },
    { key="height", desc="Height (pixels)",    type="int" },
]
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Crop images" },
    { msg = "   x-offset : {x} pixels" },
    { msg = "   y-offset : {y} pixels" },
    { msg = "   Width    : {width} pixels" },
    { msg = "   Height   : {height} pixels" },
    { msg = "-------------------------------------------------------------------------------" },
]
commands = [
    "{tool} convert -crop {width}x{height}+{x}+{y} -quality 100 {input} {output}",
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Process finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ------------------------------------------------------------------------------

[jobs.RemoveEdges]
desc     = "Trim images from top/bottom/left/right sides"
tool     = "gm"
output   = "{dir}/{base}.bmp"
params = [
    { key="top",    desc="Top    (pixels)", type="int" },
    { key="bottom", desc="Bottom (pixels)", type="int" },
    { key="left",   desc="Left   (pixels)", type="int" },
    { key="right",  desc="Right  (pixels)", type="int" },
]
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Trim images from edges" },
    { msg = "   (Top,Bottom,Left,Right) =  ({top},{bottom},{left},{right}) pixels" },
    { msg = "-------------------------------------------------------------------------------" },
]
commands = [
    "{tool} convert -crop +{left}+{top} -crop -{right}-{bottom} -quality 100 {input} {output}",
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Process finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ==============================================================================
#  IMAGE PROCESSING (2)
# ==============================================================================

[jobs.Conv2True]
desc        = "Convert images to true color (BMP format)"
tool        = "gm"
output      = "{dir}/{base}.bmp"
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Convert images to true color (BMP format)" },
    { msg = "-------------------------------------------------------------------------------" },
]
commands = [
    "{tool} convert -depth 24 -colorspace RGB {input} {output}",
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Conversion finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ------------------------------------------------------------------------------

[jobs.Conv2Gray]
desc        = "Convert images to grayscale (PNG format)"
tool        = "gm"
output      = "{dir}/{base}.png"
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Convert images to gray scale (PNG format)" },
    { msg = "-------------------------------------------------------------------------------" },
]
commands = [
    "{tool} convert -colorspace GRAY -quality 95 {input} {output}",
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Conversion finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ------------------------------------------------------------------------------

[jobs.InvertOpacity]
desc        = "Invert opacity channel (BMP format)"
tool        = "gm"
output      = "{dir}/{base}.bmp"
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Invert Opacity Channel (BMP format)" },
    { msg = "-------------------------------------------------------------------------------" },
]
commands = [
    "{tool} convert -operator Opacity Negate 100 {input} {output}",
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Conversion finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ------------------------------------------------------------------------------

[jobs.AddWatermark]
desc        = "Add watermark to images (southeast gravity)"
tool        = "gm"
output      = "{dir}/{base}_watermark.jpg"
# user-defined parameter
watermark   = "c:/_FIX/Graphic/Conv_ImageMagick/images/fuzzy-magick.png"
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Add watermark to images" },
    { msg = "   Watermark : {watermark}" },
    { msg = "-------------------------------------------------------------------------------" },
]
commands = [
    "{tool} composite -gravity southeast -quality 100 \"{watermark}\" {input} {output}",
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Process finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ==============================================================================
#  AUDIO FORMAT CONVERSION
# ==============================================================================

[jobs.Helix_MP3]
desc         = "MP3 conversion using Helix MP3 encoder"
tool         = "hmp3"
output       = "{dir}/{base}.mp3"
stderr_quiet = true
parallel    = true
max_workers = 6
params = [
    { key="ch_bitrate", desc="bitrate per channel (kbps, e.g. 64)", type="int" },
]

pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   MP3 Conversion (Helix MP3 encoder)" },
    { msg = "   Bitrate : {ch_bitrate} kbps/channel" },
    { msg = "-------------------------------------------------------------------------------" },
]
commands = [
    "{tool} {input} {output} -B{ch_bitrate} -HF2 -D",
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Conversion finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ------------------------------------------------------------------------------

[jobs.flac]
desc         = "FLAC conversion (official FLAC encoder)"
tool         = "flac"
output       = "{dir}/{base}.flac"
stderr_quiet = true
parallel     = true
max_workers  = 6
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   FLAC Conversion (official FLAC encoder)" },
    { msg = "-------------------------------------------------------------------------------" },
]
commands = [
    "{tool} -o {output} {input} --best -f",
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Conversion finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ------------------------------------------------------------------------------

[jobs.flaccl]
desc         = "FLAC conversion (FLACCL/CUETools)"
tool         = "flaccl"
output       = "{dir}/{base}.flac"
stderr_quiet = true
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   FLAC Conversion (FLACCL/CUETools, GPU accelerated)" },
    { msg = "-------------------------------------------------------------------------------" },
]
commands = [
    "{tool} -8 -o {output} {input}",
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Conversion finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ==============================================================================
#  TEXT FILE UTILITIES
# ==============================================================================

[jobs.RemoveBOM]
desc                    = "Remove UTF-8 BOM from text files (in-place)"
plugin                  = "remove_bom"
output                  = "{dir}/{base}{ext}"
allow_output_overwrite  = true
parallel                = true
max_workers             = 4
params = [
    { key="backup",   desc="Backup original as .bak before overwriting (true/false)", type="bool" },
    { key="eachline", desc="Remove BOM at the start of every line, not just file start (true/false)", type="bool" },
]
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Remove UTF-8 BOM (in-place)" },
    { msg = "-------------------------------------------------------------------------------" },
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Process finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ==============================================================================
#  IMAGE PROCESSING (PLUGIN)
# ==============================================================================

[jobs.ConvJPG]
desc        = "Recompress images to JPEG using MozJPEG"
plugin      = "mozjpeg"
output      = "{dir}/{base}.jpg"
parallel    = true
max_workers = 4
params = [
    { key="quality", desc="JPEG quality (1-100)", type="int" },
]
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   MozJPEG recompression (PARALLEL mode, {max_workers} workers)" },
    { msg = "-------------------------------------------------------------------------------" },
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Process finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ------------------------------------------------------------------------------

[jobs.bmp2png]
desc        = "Convert BMP to optimized PNG"
plugin      = "bmp2png"
output      = "{dir}/{base}.png"
parallel    = true
max_workers = 8
params = [
    { key="delete", desc="Delete original BMP after successful conversion (true/false)", type="bool" },
]
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Convert BMP to optimized PNG (PARALLEL mode, {max_workers} workers)" },
    { msg = "-------------------------------------------------------------------------------" },
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Process finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ------------------------------------------------------------------------------

# bmp2png의 폴더(디렉토리) 입력 모드 버전 — FileList 인자로 목록 파일 대신 폴더
# 경로를 직접 받아, 그 폴더(하위 폴더 포함)에서 *.bmp 파일을 자동으로 찾아 처리한다.
# (README_ko.md 4.12절 / plugin_guide_ko.md 참고)
# Total Commander 연동 시 %P 사용법은 README_ko.md 7.1절 참고 — 반드시 "%P." 형태로 trailing dot을 붙일 것.

[jobs.Bmp2PngRecursive]
desc        = "Convert BMP to optimized PNG (recursive folder input)"
plugin      = "bmp2png"
input_mode  = "directory"   # FileList 인자는 폴더 경로여야 함 — list.txt를 주면 오류
recursive   = true          # 하위 폴더까지 탐색
include     = ["*.bmp"]     # 대상 확장자
output      = "{dir}/{base}.png"
parallel    = true
max_workers = 8
params = [
    { key="delete", desc="Delete original BMP after successful conversion (true/false)", type="bool" },
]
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Convert BMP to optimized PNG (recursive folder scan, PARALLEL mode, {max_workers} workers)" },
    { msg = "-------------------------------------------------------------------------------" },
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Process finished." },
    { msg = "-------------------------------------------------------------------------------" },
]

# ------------------------------------------------------------------------------

[jobs.GroupMD5]
desc   = "Generate grouped MD5 hash files"
plugin = "group_md5"
output = ""     # BatchSession — output 개념 없음(8.3.2); global.output 상속을 명시적으로 차단
params = [
    { key="bom",        desc="Generate .md5 files as UTF-8 with BOM (true/false)", type="bool" },
    { key="chunk_size", desc="MD5 read chunk size in MB",                          type="int" },
]
pre = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Generate grouped MD5 hash files" },
    { msg = "-------------------------------------------------------------------------------" },
]
post = [
    { msg = "-------------------------------------------------------------------------------" },
    { msg = "   Process finished." },
    { msg = "-------------------------------------------------------------------------------" },
]
